name: Release

# The manifest version is the release source of truth. Merging a version bump
# to main creates the matching tag and GitHub Release automatically; reruns are
# idempotent. The release asset is the canonical zip for Catalog submission.
on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules and tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SUBMODULES_TOKEN || github.token }}

      - name: Resolve manifest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./manifest.json').version")"
          TAG="v${VERSION}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "${TAG} is already released; nothing to do."
            exit 0
          fi

          if TAG_COMMIT="$(git rev-parse -q --verify "refs/tags/${TAG}^{commit}")"; then
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::${TAG} already points to ${TAG_COMMIT}, but manifest ${VERSION} is now at ${GITHUB_SHA}. Bump manifest.version instead of moving a published tag."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG"
            git push origin "$TAG"
          fi

          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        if: steps.release.outputs.needed == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.release.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.release.outputs.needed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.release.outputs.needed == 'true'
        run: pnpm test

      - name: Package and validate
        if: steps.release.outputs.needed == 'true'
        run: pnpm package

      - name: Create GitHub Release
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$TAG" dist/*.zip --verify-tag --generate-notes --title "$TAG"
